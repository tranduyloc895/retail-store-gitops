# DynamoDB-local cho service cart (môi trường demo, thay cho DynamoDB thật của AWS).
# 1 replica + strategy Recreate (PVC ReadWriteOnce).
# -sharedDb -dbPath: lưu xuống volume để dữ liệu giỏ hàng còn sau khi pod restart.
# fsGroup 1000: image chạy non-root (uid 1000), cần để ghi được lên volume EBS.
# Service cart tự tạo bảng (create-table=true) khi khởi động.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cart-dynamodb
  namespace: retail-store
  labels:
    app: cart-dynamodb
    app.kubernetes.io/part-of: retail-store
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: cart-dynamodb
  template:
    metadata:
      labels:
        app: cart-dynamodb
    spec:
      securityContext:
        fsGroup: 1000
      containers:
        - name: dynamodb-local
          image: amazon/dynamodb-local:latest
          imagePullPolicy: IfNotPresent
          args:
            - "-jar"
            - "DynamoDBLocal.jar"
            - "-sharedDb"
            - "-dbPath"
            - "/home/dynamodblocal/data"
          ports:
            - containerPort: 8000
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 250m
              memory: 512Mi
          readinessProbe:
            tcpSocket:
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: 8000
            initialDelaySeconds: 20
            periodSeconds: 15
          volumeMounts:
            - name: data
              mountPath: /home/dynamodblocal/data
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: cart-dynamodb-data
