# MariaDB cho service catalog.
# 1 replica + strategy Recreate: PVC là ReadWriteOnce nên không cho 2 pod mount cùng lúc.
# Service catalog tự AutoMigrate + seed dữ liệu khi khởi động, nên DB chỉ cần rỗng + credential.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: catalog-mysql
  namespace: retail-store
  labels:
    app: catalog-mysql
    app.kubernetes.io/part-of: retail-store
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: catalog-mysql
  template:
    metadata:
      labels:
        app: catalog-mysql
      annotations:
        # Không cho Cluster Autoscaler evict pod DB khi scale-down (tránh restart DB).
        cluster-autoscaler.kubernetes.io/safe-to-evict: "false"
    spec:
      containers:
        - name: mariadb
          image: mariadb:11
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3306
          env:
            - name: MYSQL_DATABASE
              value: catalogdb
            - name: MYSQL_USER
              value: catalog_user
            - name: MYSQL_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: catalog-mysql-secret
                  key: password
            - name: MYSQL_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: catalog-mysql-secret
                  key: root-password
          resources:
            requests:
              cpu: 250m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          readinessProbe:
            exec:
              command: ["sh", "-c", "mariadb-admin ping -h 127.0.0.1 -u root -p$MYSQL_ROOT_PASSWORD"]
            initialDelaySeconds: 20
            periodSeconds: 10
          livenessProbe:
            exec:
              command: ["sh", "-c", "mariadb-admin ping -h 127.0.0.1 -u root -p$MYSQL_ROOT_PASSWORD"]
            initialDelaySeconds: 40
            periodSeconds: 15
          volumeMounts:
            - name: data
              mountPath: /var/lib/mysql
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: catalog-mysql-data
