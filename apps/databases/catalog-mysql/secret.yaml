# Secret cho MariaDB của service catalog.
# Mã hóa at-rest trong etcd bằng KMS envelope encryption (đã bật ở EKS control plane).
# Mật khẩu demo — môi trường thật nên dùng External Secrets Operator (xem Chương 6, hướng phát triển).
apiVersion: v1
kind: Secret
metadata:
  name: catalog-mysql-secret
  namespace: retail-store
type: Opaque
stringData:
  # password: dùng cho user ứng dụng (catalog_user) — service catalog tham chiếu key này.
  password: catalog_pass_demo
  # root-password: chỉ dùng để MariaDB khởi tạo, service không dùng.
  root-password: root_pass_demo
