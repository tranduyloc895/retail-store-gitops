apiVersion: v1
kind: Service
metadata:
  name: catalog-mysql
  namespace: retail-store
  labels:
    app: catalog-mysql
    app.kubernetes.io/part-of: retail-store
spec:
  type: ClusterIP
  selector:
    app: catalog-mysql
  ports:
    - name: mysql
      port: 3306
      targetPort: 3306
      protocol: TCP
