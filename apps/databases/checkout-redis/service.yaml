apiVersion: v1
kind: Service
metadata:
  name: checkout-redis
  namespace: retail-store
  labels:
    app: checkout-redis
    app.kubernetes.io/part-of: retail-store
spec:
  type: ClusterIP
  selector:
    app: checkout-redis
  ports:
    - name: redis
      port: 6379
      targetPort: 6379
      protocol: TCP
