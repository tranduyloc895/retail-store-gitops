# PostgreSQL cho service orders.
# 1 replica + strategy Recreate (PVC ReadWriteOnce).
# Service orders dùng Flyway (baseline-on-migrate=true) tự tạo schema khi khởi động.
# PGDATA trỏ vào subdir để tránh lỗi initdb do thư mục lost+found trên volume ext4 (EBS).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: orders-postgres
  namespace: retail-store
  labels:
    app: orders-postgres
    app.kubernetes.io/part-of: retail-store
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: orders-postgres
  template:
    metadata:
      labels:
        app: orders-postgres
      annotations:
        # Không cho Cluster Autoscaler evict pod DB khi scale-down (tránh restart DB).
        cluster-autoscaler.kubernetes.io/safe-to-evict: "false"
    spec:
      containers:
        - name: postgres
          image: postgres:16
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 5432
          env:
            - name: POSTGRES_DB
              value: ordersdb
            - name: POSTGRES_USER
              value: orders_user
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: orders-postgres-secret
                  key: password
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          resources:
            requests:
              cpu: 250m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          readinessProbe:
            exec:
              command: ["sh", "-c", "pg_isready -U $POSTGRES_USER -d $POSTGRES_DB -h 127.0.0.1"]
            initialDelaySeconds: 15
            periodSeconds: 10
          livenessProbe:
            exec:
              command: ["sh", "-c", "pg_isready -U $POSTGRES_USER -d $POSTGRES_DB -h 127.0.0.1"]
            initialDelaySeconds: 30
            periodSeconds: 15
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: orders-postgres-data
