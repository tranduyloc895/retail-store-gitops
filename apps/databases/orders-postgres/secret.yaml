# Secret cho PostgreSQL của service orders.
# Mã hóa at-rest trong etcd bằng KMS envelope encryption (đã bật ở EKS control plane).
# Mật khẩu demo — môi trường thật nên dùng External Secrets Operator (xem Chương 6).
apiVersion: v1
kind: Secret
metadata:
  name: orders-postgres-secret
  namespace: retail-store
type: Opaque
stringData:
  # password: dùng cho user ứng dụng (orders_user) — service orders tham chiếu key này.
  password: orders_pass_demo
