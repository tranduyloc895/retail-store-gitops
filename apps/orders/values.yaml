name: orders

image:
  repository: 736508008585.dkr.ecr.ap-southeast-1.amazonaws.com/retail-store/orders
  tag: "9878c8d"

resources:
  requests:
    cpu: 256m
    memory: 512Mi
  limits:
    cpu: 512m
    memory: 1Gi

probes:
  readiness:
    path: /actuator/health/readiness
    initialDelaySeconds: 30
    periodSeconds: 10
  liveness:
    path: /actuator/health/liveness
    initialDelaySeconds: 60
    periodSeconds: 15

monitoring:
  path: /actuator/prometheus

# Kết nối PostgreSQL dùng chung; service dùng Flyway tự tạo schema khi khởi động.
# messaging giữ mặc định in-memory (đã exclude RabbitAutoConfiguration) nên không cần message broker.
env:
  - {name: RETAIL_ORDERS_PERSISTENCE_PROVIDER, value: "postgres"}
  - {name: RETAIL_ORDERS_PERSISTENCE_POSTGRES_ENDPOINT, value: "orders-postgres:5432"}
  - {name: RETAIL_ORDERS_PERSISTENCE_POSTGRES_DBNAME,   value: "ordersdb"}
  - {name: RETAIL_ORDERS_PERSISTENCE_POSTGRES_USERNAME, value: "orders_user"}
  - name: RETAIL_ORDERS_PERSISTENCE_POSTGRES_PASSWORD
    valueFrom:
      secretKeyRef:
        name: orders-postgres-secret
        key: password
