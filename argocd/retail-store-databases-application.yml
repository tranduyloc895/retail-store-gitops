# 4 datastore dùng chung cho các service ghi dữ liệu (catalog, cart, orders, checkout).
# sync-wave -5: sau namespace (-10), trước các microservice (mặc định 0) để DB lên trước.
# directory.recurse: true — bắt buộc vì manifest nằm trong các thư mục con apps/databases/<db>/.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: retail-store-databases
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-5"
spec:
  project: default
  source:
    repoURL: https://github.com/tranduyloc895/retail-store-gitops.git
    targetRevision: main
    path: apps/databases
    directory:
      recurse: true
  destination:
    server: https://kubernetes.default.svc
    namespace: retail-store
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=false
