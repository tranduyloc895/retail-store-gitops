apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: retail-store-namespace
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-10"
spec:
  project: default
  source:
    repoURL: https://github.com/tranduyloc895/retail-store-gitops.git
    targetRevision: main
    path: apps/namespace
  destination:
    server: https://kubernetes.default.svc
  syncPolicy:
    automated:
      prune: false
      selfHeal: true
