apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: retail-store-ui
  namespace: argocd
spec:
  project: default
  sources:
    - repoURL: https://github.com/tranduyloc895/retail-store-gitops.git
      targetRevision: main
      path: charts/microservice
      helm:
        releaseName: ui
        valueFiles:
          - $values/apps/ui/values.yaml
    - repoURL: https://github.com/tranduyloc895/retail-store-gitops.git
      targetRevision: main
      ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: retail-store
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=false
