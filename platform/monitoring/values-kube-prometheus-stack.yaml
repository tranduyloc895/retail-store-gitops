# =============================================================================
# kube-prometheus-stack values
# Chart: prometheus-community/kube-prometheus-stack
# Purpose: Override mặc định cho phù hợp EKS t3.large cluster
# =============================================================================

# -----------------------------------------------------------------------------
# PROMETHEUS — TSDB lưu metrics
# -----------------------------------------------------------------------------
prometheus:
  prometheusSpec:
    retention: 15d

    # Prometheus ngốn RAM theo số series — request 512Mi đủ cho ~5 service ở intern scope.
    # Cluster 2× t3.large (~13Gi allocatable) đã chạy 5 microservices + ArgoCD + observability stack
    # → request 2Gi không schedule nổi. 512Mi/1Gi đủ cho TSDB ~15 ngày retention.
    resources:
      requests:
        cpu: 200m
        memory: 512Mi
      limits:
        cpu: 1000m
        memory: 1500Mi

    # Persistent storage — KHÔNG dùng emptyDir, mất hết khi pod restart.
    storageSpec:
      volumeClaimTemplate:
        spec:
          storageClassName: gp3
          accessModes: ["ReadWriteOnce"]
          resources:
            requests:
              storage: 20Gi

    # Cho phép Prometheus scrape ServiceMonitor / PodMonitor ở MỌI namespace,
    # không chỉ những cái có label "release=kps".
    # Nếu để true (default), phải gắn label release=kps vào từng ServiceMonitor —
    # khó bắt khi viết manifest cho app.
    serviceMonitorSelectorNilUsesHelmValues: false
    podMonitorSelectorNilUsesHelmValues: false
    ruleSelectorNilUsesHelmValues: false
    probeSelectorNilUsesHelmValues: false

# -----------------------------------------------------------------------------
# ALERTMANAGER — định tuyến alert
# -----------------------------------------------------------------------------
alertmanager:
  alertmanagerSpec:
    # Mount Secret chứa Telegram bot token vào
    # /etc/alertmanager/secrets/telegram-alertmanager-secret/bot-token
    # Secret tạo out-of-band (không commit token vào Git) — xem README.
    secrets:
      - telegram-alertmanager-secret
    resources:
      requests:
        cpu: 50m
        memory: 128Mi
      limits:
        cpu: 200m
        memory: 256Mi
    storage:
      volumeClaimTemplate:
        spec:
          storageClassName: gp3
          accessModes: ["ReadWriteOnce"]
          resources:
            requests:
              storage: 2Gi

  # Định tuyến: CHỈ alert demo (label channel=telegram) gửi Telegram; toàn bộ
  # alert mặc định của kube-prometheus-stack -> receiver 'null' (tránh spam).
  config:
    global:
      resolve_timeout: 5m
    route:
      receiver: 'null'
      group_by: ['alertname']
      group_wait: 30s
      group_interval: 1m
      repeat_interval: 4h
      routes:
        - receiver: 'null'
          matchers:
            - alertname = "Watchdog"
        - receiver: 'telegram'
          matchers:
            - channel = "telegram"
          group_wait: 20s
          group_interval: 1m
          repeat_interval: 1h
    receivers:
      - name: 'null'
      - name: 'telegram'
        telegram_configs:
          - bot_token_file: /etc/alertmanager/secrets/telegram-alertmanager-secret/bot-token
            chat_id: 5213906528
            parse_mode: HTML
            send_resolved: true
            message: |-
              {{ range .Alerts }}<b>{{ .Labels.alertname }}</b> [{{ .Status }}]
              {{ .Annotations.summary }}
              {{ end }}

# -----------------------------------------------------------------------------
# GRAFANA — UI
# -----------------------------------------------------------------------------
grafana:
  admin:
    existingSecret: grafana-admin
    userKey: admin-user
    passwordKey: admin-password

  service:
    type: ClusterIP
    port: 80

  persistence:
    enabled: true
    storageClassName: gp3
    size: 5Gi

  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi

  # === Thêm Loki datasource (Prometheus đã có sẵn) ===
  additionalDataSources:
    - name: Loki
      type: loki
      access: proxy
      url: http://loki-gateway.monitoring.svc.cluster.local
      isDefault: false
      editable: false

  # === Sidecar: auto-load dashboards từ ConfigMap có label grafana_dashboard=1 ===
  # Đây là cơ chế cho phép commit dashboard JSON vào Git như một ConfigMap,
  # Grafana sẽ tự detect và import mà không cần thao tác UI.
  sidecar:
    dashboards:
      enabled: true
      label: grafana_dashboard
      labelValue: "1"
      searchNamespace: ALL   # Tìm ConfigMap ở mọi namespace
      folderAnnotation: grafana_folder
      provider:
        foldersFromFilesStructure: true

    # Auto-load datasources từ ConfigMap có label grafana_datasource=1
    datasources:
      enabled: true
      label: grafana_datasource
      labelValue: "1"
      searchNamespace: ALL

# -----------------------------------------------------------------------------
# NODE EXPORTER — chạy trên mỗi node, expose system metrics (CPU, RAM, Disk)
# -----------------------------------------------------------------------------
nodeExporter:
  enabled: true

prometheus-node-exporter:
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 200m
      memory: 128Mi

# -----------------------------------------------------------------------------
# KUBE-STATE-METRICS — expose K8s object metrics (deployments, pods, PVCs...)
# -----------------------------------------------------------------------------
kube-state-metrics:
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      cpu: 200m
      memory: 256Mi

# -----------------------------------------------------------------------------
# Components tắt để tiết kiệm resource (có thể bật khi cần)
# -----------------------------------------------------------------------------
kubeEtcd:
  enabled: false

# Control plane components của EKS cũng managed
kubeControllerManager:
  enabled: false
kubeScheduler:
  enabled: false
kubeProxy:
  enabled: false

# -----------------------------------------------------------------------------
# ALERT RULES (demo autoscaling / tải) — gửi Telegram qua label channel=telegram
# additionalPrometheusRulesMap tự sinh PrometheusRule với label release đúng,
# Prometheus nhặt nhờ ruleSelectorNilUsesHelmValues=false ở trên.
# -----------------------------------------------------------------------------
additionalPrometheusRulesMap:
  demo-autoscaling-alerts:
    groups:
      - name: autoscaling-demo
        rules:
          # 1) Tải vượt ngưỡng: tổng CPU dùng của UI > 60% tổng CPU request, giữ 1 phút.
          #    Đây là alert chắc chắn fire nhất khi chạy hey -c 80.
          - alert: UIHighCPULoad
            expr: |
              sum(rate(container_cpu_usage_seconds_total{namespace="retail-store", container="ui"}[2m]))
              /
              sum(kube_pod_container_resource_requests{namespace="retail-store", container="ui", resource="cpu"})
              > 0.6
            for: 1m
            labels:
              severity: warning
              channel: telegram
            annotations:
              summary: "UI CPU vuot 60% request — dang chiu tai cao, HPA se scale pod."

          # 2) HPA chạm trần: current_replicas >= max_replicas (UI tối đa 6).
          - alert: UIHpaMaxedOut
            expr: |
              kube_horizontalpodautoscaler_status_current_replicas{namespace="retail-store", horizontalpodautoscaler="ui"}
              >=
              kube_horizontalpodautoscaler_spec_max_replicas{namespace="retail-store", horizontalpodautoscaler="ui"}
            for: 1m
            labels:
              severity: warning
              channel: telegram
            annotations:
              summary: "HPA cua UI da cham tran maxReplicas — het du dia scale pod."

          # 3) Pod Pending ở retail-store: tín hiệu thiếu chỗ schedule -> CA sẽ thêm node.
          - alert: RetailStorePodPending
            expr: sum(kube_pod_status_phase{namespace="retail-store", phase="Pending"}) > 0
            for: 1m
            labels:
              severity: warning
              channel: telegram
            annotations:
              summary: "Co pod Pending o retail-store — thieu node, Cluster Autoscaler se them node."

          # 4) Số node tăng so với 15 phút trước -> Cluster Autoscaler đã scale-up node.
          #    Không hardcode baseline; tự so với chính cluster 15 phút trước.
          - alert: ClusterNodeScaledUp
            expr: count(kube_node_info) > count(kube_node_info offset 15m)
            for: 0m
            labels:
              severity: info
              channel: telegram
            annotations:
              summary: "Cluster Autoscaler da them node (so node tang so voi 15 phut truoc)."
